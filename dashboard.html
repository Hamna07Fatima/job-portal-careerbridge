<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Dashboard | CareerBridge</title>
</head>
<body>
<div class="container py-5" style="max-width:720px">
  <a class="brand" href="index.html">Career<span>Bridge</span></a>
  <div class="dash-card mt-4">
    <h1 id="hello">Loading…</h1>
    <p><span class="badge-role" id="role"></span></p>
    <button class="btn btn-outline-ink btn-sm" id="logout">Log out</button>
  </div>
</div>
<script>
fetch('api/me.php').then(r => r.json()).then(d => {
  if (!d.ok) return location.replace('login.html');
  document.getElementById('hello').textContent = 'Welcome, ' + d.user.name;
  document.getElementById('role').textContent = d.user.role;
}).catch(() => location.replace('login.html'));
document.getElementById('logout').onclick = () => fetch('api/logout.php').then(() => location.replace('login.html'));
</script>
</body>
</html>
