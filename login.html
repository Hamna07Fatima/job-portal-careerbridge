<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Log in | CareerBridge</title>
</head>
<body>
<main class="auth">
  <aside class="auth-brand">
    <a class="brand" href="index.html">Career<span>Bridge</span></a>
    <div>
      <h2>Welcome back.</h2>
      <ul class="pipeline" aria-hidden="true">
        <li class="done">Applied</li><li class="done">Shortlisted</li><li class="now">Interview scheduled</li><li>Hired</li>
      </ul>
    </div>
    <small>Job seekers and employers share one platform.</small>
  </aside>
  <section class="auth-form">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="text-muted-cb mb-4">New here? <a href="register.html">Create an account</a></p>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email address</label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-group has-validation">
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            <button type="button" class="btn btn-toggle" aria-label="Show or hide password">Show</button>
            <div class="invalid-feedback">Enter your password.</div>
          </div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember" name="remember">
          <label class="form-check-label small" for="remember">Keep me signed in</label>
        </div>
        <button class="btn btn-brand w-100" type="submit" id="submitBtn">Log in</button>
      </form>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
